name: Apply JSP-000682 catalog update
on:
  push:
    branches: [submission/jsp-000682-asdfdev0]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: submission/jsp-000682-asdfdev0
      - name: Update JSP-000682 records
        run: |
          python3 - <<'PY'
          from pathlib import Path

          proof_sha = '1b1318fbc6dbcd5bcfcf68f6e07947e62dc9f047'
          catalog = Path('problems/catalog-0601-0700.md')
          text = catalog.read_text()
          start = text.index('<a id="JSP-000682"></a>')
          end = text.index('<a id="JSP-000683"></a>', start)
          block = text[start:end]
          block = block.replace('| Current status | Open |', '| Current status | Solved<br>Proof contributors: asdfdev0. |')
          block = block.replace(
              '| Lean proof | No |',
              f'| Lean proof | Yes — [Lean source](https://github.com/asdfdev0/jsp-000682-lean/blob/{proof_sha}/JSP000682/Solution.lean)<br>Formalization contributors: asdfdev0. |\n'
              f'| Attribution basis | Mathematical and Lean: repository-owner attribution. [Solver attribution source 1](https://github.com/asdfdev0/jsp-000682-lean/blob/{proof_sha}/README.md) [Lean attribution source 1](https://github.com/asdfdev0/jsp-000682-lean/blob/{proof_sha}/JSP000682/Solution.lean) |'
          )
          text = text[:start] + block + text[end:]
          catalog.write_text(text)

          index = Path('problems/README.md')
          text = index.read_text()
          old = '| JSP-000682 | [Is there an integer whose succeeding positions have divisor counts bounded linearly in their distance from it?](catalog-0601-0700.md#JSP-000682) | Open | No | No | Unavailable |'
          new = '| JSP-000682 | [Is there an integer whose succeeding positions have divisor counts bounded linearly in their distance from it?](catalog-0601-0700.md#JSP-000682) | Solved | Yes | No | Unavailable |'
          if old not in text:
              raise SystemExit('JSP-000682 index row not found')
          index.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/apply-jsp-000682.yml
          git config user.name 'asdfdev0'
          git config user.email 'asdfdev0@users.noreply.github.com'
          git add problems/catalog-0601-0700.md problems/README.md .github/workflows/apply-jsp-000682.yml
          git commit -m 'catalog: submit solution and Lean proof for JSP-000682'
          git push origin HEAD:submission/jsp-000682-asdfdev0
