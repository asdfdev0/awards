name: Apply JSP-000682 final proof pin
on:
  push:
    branches: [submission/jsp-000682-asdfdev0]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor == 'asdfdev0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: submission/jsp-000682-asdfdev0
      - name: Update final proof pin and source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('problems/catalog-0601-0700.md')
          s = p.read_text()
          old = '1b1318fbc6dbcd5bcfcf68f6e07947e62dc9f047'
          new = 'b38560763b412ccf84cdc85963634ad3bd0dfafb'
          if old not in s:
              raise SystemExit('old proof SHA not found')
          s = s.replace(old, new)
          anchor = '<a id="JSP-000682"></a>'
          nxt = '<a id="JSP-000683"></a>'
          before, rest = s.split(anchor, 1)
          block, after = rest.split(nxt, 1)
          block = block.replace('| Publication details |  |', '| Publication details | [Erdős #826](https://www.erdosproblems.com/826) — original infinitude formulation. |', 1)
          s = before + anchor + block + nxt + after
          p.write_text(s)
          PY
          rm .github/workflows/apply-jsp-000682-final.yml
          git config user.name 'asdfdev0'
          git config user.email 'asdfdev0@users.noreply.github.com'
          git add problems/catalog-0601-0700.md .github/workflows/apply-jsp-000682-final.yml
          git commit -m 'catalog: pin verified JSP-000682 Lean proof'
          git push origin HEAD:submission/jsp-000682-asdfdev0
